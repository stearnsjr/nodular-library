services:
  storytellers-library:
    build: .
    container_name: storytellers-library
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - MAX_BACKUPS=20
      - BACKUP_INTERVAL_SEC=60
      - MAX_BODY_MB=50
      # Uncomment to enable browser Basic Auth password protection:
      # - LIBRARY_PASSWORD=choose-a-strong-password
      # Optional Kroger Developer API credentials (can also be configured in-app):
      # - KROGER_CLIENT_ID=your-kroger-client-id
      # - KROGER_CLIENT_SECRET=your-kroger-client-secret
      # - KROGER_REDIRECT_URI=http://localhost:3000/api/kroger/auth/callback
      # - KROGER_ENV=prod
